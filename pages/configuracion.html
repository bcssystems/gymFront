<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-sliders-h me-2" style="color:var(--primary)"></i>Configuraci&oacute;n del sistema</h4>
      <small class="text-muted">Par&aacute;metros generales de Gym</small>
    </div>
    <button class="btn btn-primary btn-sm" id="btnGuardarConfig"><i class="fas fa-save me-1"></i>Guardar todo</button>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="panel-card p-3">
        <h6 class="fw-semibold mb-1"><i class="fas fa-wallet me-2" style="color:var(--primary)"></i>Fondo general</h6>
        <small class="text-muted d-block mb-3">Fondo general con el que se abre la caja</small>
        <label class="form-label small fw-semibold">Fondo general ($)</label>
        <input type="number" class="form-control" id="cfg-fondoCajas" step="0.01" min="0">
        <div class="form-text" id="desc-fondoCajas"></div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="panel-card p-3">
        <h6 class="fw-semibold mb-1"><i class="fas fa-print me-2" style="color:var(--primary)"></i>Impresión</h6>
        <label class="form-label small fw-semibold">Logo del ticket</label>
        <input type="file" class="form-control mb-2" id="cfg-logoArchivo" accept="image/png,image/jpeg,image/webp,image/svg+xml">
        <div class="form-text mb-2" id="cfg-logoActual">Se conserva el logo actual si no seleccionas otro.</div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="panel-card p-3">
        <h6 class="fw-semibold mb-1"><i class="fas fa-calendar-xmark me-2" style="color:#dc2626"></i>Membres&iacute;as</h6>
        <small class="text-muted d-block mb-3">Desactivaci&oacute;n autom&aacute;tica por vencimiento</small>
        <label class="form-label small fw-semibold">D&iacute;as posteriores al vencimiento</label>
        <input type="number" class="form-control" id="cfg-diasDesactivacionMembresia" min="0">
        <div class="form-text">El sistema desactivar&aacute; al cliente autom&aacute;ticamente cada d&iacute;a.</div>
      </div>
    </div>

  </div>
</div>
