<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-address-book me-2" style="color:var(--primary)"></i>Clientes</h4>
      <small class="text-muted">Gesti&oacute;n de clientes</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoCliente">
      <i class="fas fa-plus me-1"></i> Nuevo Cliente
    </button>
  </div>

  <div class="filter-bar">
    <input type="text" class="form-control" id="searchCliente" placeholder="Buscar por nombre o EmployeeNo...">
    <button class="btn btn-outline-secondary btn-sm text-nowrap ms-2" id="btnToggleClientesInactivos">
      <i class="fas fa-eye me-1"></i> Mostrar inactivos
    </button>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0" style="white-space:nowrap;min-width:100%">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>EmployeeNo</th>
            <th>Membres&iacute;a</th>
            <th>Vencimiento</th>
            <th>Estado</th>
            <th style="width:170px"></th>
          </tr>
        </thead>
        <tbody id="tableClientesBody">
           <tr><td colspan="7"><div class="empty-state"><i class="fas fa-address-book"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationClientes"></div>
</div>

<div class="modal fade" id="clienteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="clienteModalTitle">Nuevo Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formCliente">
          <input type="hidden" id="clienteId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="clienteNombre" required maxlength="100">
            </div>
            <div class="col-md-6">
              <label class="form-label">Apellido Paterno <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="clienteApaterno" required maxlength="100">
            </div>
            <div class="col-md-6">
              <label class="form-label">Apellido Materno</label>
              <input type="text" class="form-control" id="clienteAmaterno" maxlength="100">
            </div>
            <div class="col-12">
              <label class="form-label">Foto del cliente</label>
              <div class="d-flex align-items-center gap-3">
                <div id="clienteFotoPreview" class="rounded-circle bg-light d-flex align-items-center justify-content-center text-primary" style="width:82px;height:82px;overflow:hidden">
                  <i class="fas fa-user fa-2x"></i>
                </div>
                <div>
                  <input type="file" class="form-control form-control-sm" id="clienteFotoInput" accept="image/*" capture="user">
                  <button type="button" class="btn btn-outline-danger btn-sm mt-2 d-none" id="btnEliminarFotoCliente"><i class="fas fa-trash me-1"></i>Eliminar foto</button>
                  <div class="form-text">Solo una imagen, máximo 5 MB.</div>
                </div>
              </div>
            </div>
              <div class="col-12"><hr class="my-1"></div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarCliente">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="clienteDetalleModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold"><i class="fas fa-user-circle me-1" style="color:var(--primary)"></i> Detalle del Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-2">
        <div class="row g-3">
          <div class="col-md-6">
            <div class="panel-card mb-0">
              <h6 class="fw-semibold mb-2"><i class="fas fa-id-card me-1"></i> Datos generales</h6>
              <div id="clienteDetalleGeneral" class="small"></div>
            </div>
          </div>
            <div class="col-md-6">
              <div class="panel-card mb-0 text-center">
                <h6 class="fw-semibold mb-2"><i class="fas fa-camera me-1"></i> Foto</h6>
                <div id="clienteDetalleFoto" class="d-flex justify-content-center"></div>
              </div>
            </div>
            <div class="col-12"><div class="panel-card mb-0"><h6 class="fw-semibold mb-2"><i class="fas fa-map-marker-alt me-1"></i> Dirección</h6><div id="clienteDetalleDireccion" class="small"></div></div></div>
           <div class="col-12"><div class="panel-card mb-0"><h6 class="fw-semibold mb-2"><i class="fas fa-id-card me-1"></i> Membres&iacute;a</h6><div id="clienteDetalleMembresia" class="small"></div></div></div>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
