<style>
  .movimientos-detalle-table { min-width: 760px; }
  .movimientos-detalle-table .searchable-wrapper { width: 100%; min-width: 360px; }
  .movimientos-detalle-table .searchable-input { width: 100%; min-width: 360px; }
</style>
<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-arrows-rotate me-2" style="color:var(--primary)"></i>Movimientos de Inventario</h4>
      <small class="text-muted">Registrar y administrar entradas y salidas de stock por sucursal</small>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary ripple" id="btnNuevoMovimiento">
        <i class="fas fa-plus me-1"></i> Nuevo Movimiento
      </button>
      <button class="btn btn-outline-success ripple" id="btnExportMovExcel">
        <i class="fas fa-file-excel me-1"></i> Excel
      </button>
      <button class="btn btn-outline-danger ripple" id="btnExportMovPdf">
        <i class="fas fa-file-pdf me-1"></i> PDF
      </button>
    </div>
  </div>

  <div class="filter-bar filter-bar-5cols">
    <div>
      <label class="form-label mb-1 small text-muted">Sucursal</label>
      <select class="form-select" id="filterMovSucursal">
        <option value="">Cargando...</option>
      </select>
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Producto</label>
      <select class="form-select" id="filterMovProducto">
        <option value="">Todos</option>
      </select>
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Desde</label>
      <input type="date" class="form-control" id="filterMovFechaInicio">
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Hasta</label>
      <input type="date" class="form-control" id="filterMovFechaFin">
    </div>
    <div>
      <label class="form-label mb-1 small text-muted">Tipo</label>
      <select class="form-select" id="filterMovTipo">
        <option value="">Todos</option>
        <option value="ENTRADA">Entrada</option>
         <option value="SALIDA">Salida</option>
         <option value="TRANSFERENCIA">Transferencia</option>
         <option value="MERMA">Merma</option>
         <option value="DEVOLUCION">Devoluci&oacute;n</option>
      </select>
    </div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Producto</th>
            <th>Detalle</th>
             <th>Cantidad</th>
             <th>Costo total</th>
            <th>Stock</th>
            <th>Sucursal</th>
            <th>Responsable</th>
            <th style="width:60px"></th>
          </tr>
        </thead>
        <tbody id="tableMovBody">
           <tr><td colspan="10"><div class="empty-state"><i class="fas fa-arrows-rotate"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationMov"></div>
</div>

<div class="modal fade" id="movimientoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="movimientoModalTitle">Nuevo Movimiento</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="max-height:70vh;overflow-y:auto">
        <form id="formMovimiento">
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Sucursal <span class="text-danger">*</span></label>
              <select class="form-select" id="movSucursal" required>
                <option value="">Selecciona una sucursal...</option>
              </select>
              <div class="form-text" id="movStockInfo"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Tipo de movimiento <span class="text-danger">*</span></label>
              <select class="form-select" id="movTipoMovimiento" required>
                <option value="ENTRADA">Entrada</option>
                <option value="SALIDA">Salida</option>
                <option value="MERMA">Merma</option>
                <option value="DEVOLUCION">Devolución</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Vale / folio</label>
              <input type="text" class="form-control" id="movReferencia" maxlength="100" placeholder="Ej. R-0001">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Observaciones</label>
              <input type="text" class="form-control" id="movObservacion" maxlength="500" placeholder="Observación opcional">
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label fw-semibold mb-0">Productos o variantes</label>
            <button type="button" class="btn btn-outline-primary btn-sm" id="btnAgregarLineaMovimiento"><i class="fas fa-plus me-1"></i>Agregar producto</button>
          </div>

          <div class="table-responsive">
              <table class="table table-custom mb-0 movimientos-detalle-table">
              <thead>
                <tr>
                  <th style="min-width:390px">Producto o variante</th>
                  <th style="width:100px">Cantidad</th>
                  <th style="width:125px">Subtotal</th>
                  <th style="width:50px"></th>
                </tr>
              </thead>
              <tbody id="tableDetallesMovimiento"></tbody>
            </table>
          </div>

          <div class="d-flex justify-content-end gap-4 mt-3 pe-2">
            <div><small class="text-muted">Total cantidad</small><div class="fw-bold fs-5" id="movTotalCantidad">0</div></div>
            <div><small class="text-muted">Costo total</small><div class="fw-bold fs-5" style="color:var(--primary)" id="movTotalCosto">$0.00</div></div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnConfirmarMovimiento">
          <i class="fas fa-check me-1"></i> Registrar
        </button>
      </div>
    </div>
  </div>
</div>
