<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-truck-loading me-2" style="color:var(--primary)"></i>Compras</h4>
      <small class="text-muted">Entrada directa de mercanc&iacute;a a inventario</small>
    </div>
    <button class="btn btn-primary btn-sm" id="btnNuevaCompra"><i class="fas fa-plus me-1"></i>Nueva compra</button>
  </div>

  <div class="row g-3 mb-3" id="statsCompras">
    <div class="col-md-3 col-sm-6">
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(37,99,235,.12);color:#2563EB"><i class="fas fa-truck-loading"></i></div>
        <div class="stat-info"><div class="stat-number" id="statCompras">0</div><div class="stat-label">Compras</div></div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6">
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(16,185,129,.12);color:#10b981"><i class="fas fa-ruler-horizontal"></i></div>
        <div class="stat-info"><div class="stat-number" id="statCantidad">0</div><div class="stat-label">Cantidad total</div></div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6">
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(245,158,11,.12);color:#f59e0b"><i class="fas fa-circle-stack"></i></div>
        <div class="stat-info"><div class="stat-number" id="statProductosRecibidos">0</div><div class="stat-label">Productos recibidos</div></div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6">
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(139,92,246,.12);color:#8b5cf6"><i class="fas fa-clock-rotate-left"></i></div>
        <div class="stat-info"><div class="stat-number" id="statCantidad30">0</div><div class="stat-label">Cantidad últimos 30 días</div></div>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" class="form-control" id="searchCompras" placeholder="Buscar por folio o proveedor..." style="min-width:240px">
    <select class="form-select" id="filtroSucursalCompra" style="min-width:200px">
      <option value="">Todas las sucursales</option>
    </select>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>Folio</th>
            <th>Proveedor</th>
            <th>Sucursal</th>
            <th>Cantidad</th>
            <th>Usuario</th>
            <th>Fecha</th>
            <th style="width:120px"></th>
          </tr>
        </thead>
        <tbody id="tableComprasBody">
          <tr><td colspan="8"><div class="empty-state"><i class="fas fa-truck-loading"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal nueva compra -->
<div class="modal fade" id="modalCompra" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold"><i class="fas fa-truck-loading me-2" style="color:var(--primary)"></i>Nueva compra</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="max-height:70vh;overflow-y:auto">
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Sucursal *</label>
            <select class="form-select" id="cmpSucursal"></select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Proveedor</label>
            <select class="form-select" id="cmpProveedor"><option value="">Sin proveedor</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Nota</label>
            <input type="text" class="form-control" id="cmpNota" placeholder="Nota opcional">
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label fw-semibold mb-0">Productos</label>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-success btn-sm" id="btnNuevoProductoCompra"><i class="fas fa-box me-1"></i>Nuevo producto</button>
            <button type="button" class="btn btn-outline-primary btn-sm" id="btnAgregarDetalle"><i class="fas fa-plus me-1"></i>Agregar producto</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-custom mb-0">
            <thead>
              <tr>
                <th style="min-width:280px">Producto</th>
                <th style="width:120px">Cantidad</th>
                <th style="width:110px">Precio compra</th>
                <th style="width:120px">Subtotal</th>
                <th style="width:50px"></th>
              </tr>
            </thead>
            <tbody id="tableDetallesCompra"></tbody>
          </table>
        </div>

        <div class="d-flex justify-content-end gap-4 mt-3 pe-2">
          <div><small class="text-muted">Total cantidad</small><div class="fw-bold fs-5" id="cmpTotalCantidad">0</div></div>
          <div><small class="text-muted">Total compra</small><div class="fw-bold fs-5" style="color:var(--primary)" id="cmpTotalCompra">$0.00</div></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarCompra"><i class="fas fa-save me-1"></i>Guardar compra</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalNuevoProductoCompra" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold"><i class="fas fa-box me-2" style="color:var(--success)"></i>Nuevo producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formNuevoProductoCompra">
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="cmpProductoNombre" maxlength="200" required>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Categor&iacute;a <span class="text-danger">*</span></label>
              <select class="form-select" id="cmpProductoCategoria" required>
                <option value="">Seleccionar categor&iacute;a</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Unidad</label>
              <select class="form-select" id="cmpProductoUnidad">
                <option value="PIEZA">PIEZA</option>
                <option value="COMBO">COMBO</option>
                <option value="KG">KG</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Precio p&uacute;blico</label>
              <input type="number" class="form-control" id="cmpProductoPrecio" min="0" step="0.01">
            </div>
            <div class="col-md-6">
              <label class="form-label">Costo de compra</label>
              <input type="number" class="form-control" id="cmpProductoCosto" min="0" step="0.01">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" id="btnGuardarProductoCompra">Crear y agregar</button>
      </div>
    </div>
  </div>
</div>
