<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-id-card me-2" style="color:var(--primary)"></i>Membresías activas</h4>
      <small class="text-muted">Clientes con una membresía vigente</small>
    </div>
  </div>

  <div class="panel-card p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-lg-4 col-md-6">
        <label class="form-label small mb-1">Buscar</label>
        <input type="text" class="form-control" id="searchMembresiaActiva" placeholder="Nombre, EmployeeNo o membresía...">
      </div>
      <div class="col-lg-3 col-md-6">
        <label class="form-label small mb-1">Tipo de membresía</label>
        <select class="form-select" id="filtroTipoMembresiaActiva"><option value="">Todos los tipos</option></select>
      </div>
      <div class="col-lg-2 col-md-6">
        <label class="form-label small mb-1">Inicio de membresía</label>
        <input type="date" class="form-control" id="filtroInicioDesde">
      </div>
      <div class="col-lg-2 col-md-6">
        <label class="form-label small mb-1">Fin de membresía</label>
        <input type="date" class="form-control" id="filtroFinHasta">
      </div>
      <div class="col-lg-1 col-md-6">
        <button class="btn btn-outline-secondary w-100" id="btnLimpiarFiltrosMembresias" title="Limpiar filtros"><i class="fas fa-eraser"></i></button>
      </div>
    </div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0" style="white-space:nowrap;min-width:100%">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>EmployeeNo</th>
            <th>Membresía</th>
            <th>Inicio</th>
            <th>Vencimiento</th>
            <th>Días restantes</th>
            <th style="width:150px"></th>
          </tr>
        </thead>
        <tbody id="tableMembresiasActivasBody">
          <tr><td colspan="7"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="mt-3" id="paginationMembresiasActivas"></div>
</div>
