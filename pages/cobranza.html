<div class="page-content">
  <div class="page-header"><div><h4><i class="fas fa-hand-holding-dollar me-2" style="color:var(--primary)"></i>Cobranza</h4><small class="text-muted">Agenda de cobros y registro de abonos</small></div></div>
  <div class="panel-card p-3 mb-3"><div class="row g-2 align-items-end">
    <div class="col-md-3"><label class="form-label small">Desde</label><input type="date" class="form-control form-control-sm" id="cobranzaDesde"></div>
    <div class="col-md-3"><label class="form-label small">Hasta</label><input type="date" class="form-control form-control-sm" id="cobranzaHasta"></div>
    <div class="col-md-3"><label class="form-label small">Estado</label><select class="form-select form-select-sm" id="cobranzaEstado"><option value="">Todos</option><option value="PENDIENTE">Pendientes</option><option value="PARCIAL">Parciales</option><option value="PAGADA">Pagadas</option></select></div>
    <div class="col-md-3 d-flex gap-2"><button class="btn btn-primary btn-sm flex-grow-1" id="btnBuscarCobranza"><i class="fas fa-search me-1"></i>Buscar</button><button class="btn btn-outline-secondary btn-sm" id="btnHoyCobranza">Hoy</button></div>
  </div></div>
  <div class="row g-3 mb-3"><div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:rgba(37,99,235,.12);color:#2563eb"><i class="fas fa-calendar-day"></i></div><div class="stat-info"><div class="stat-number" id="cobranzaTotal">0</div><div class="stat-label">Parcialidades</div></div></div></div><div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:rgba(245,158,11,.12);color:#f59e0b"><i class="fas fa-coins"></i></div><div class="stat-info"><div class="stat-number" id="cobranzaSaldo">$0.00</div><div class="stat-label">Saldo programado</div></div></div></div><div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,.12);color:#10b981"><i class="fas fa-check-circle"></i></div><div class="stat-info"><div class="stat-number" id="cobranzaPagado">$0.00</div><div class="stat-label">Total pagado</div></div></div></div></div>
  <div class="panel-card overflow-hidden"><div class="table-responsive"><table class="table table-custom mb-0"><thead><tr><th>Fecha</th><th>Cliente</th><th>Contacto</th><th>Dirección</th><th>Crédito</th><th class="text-end">Programado</th><th class="text-end">Saldo</th><th>Estado</th><th></th></tr></thead><tbody id="tableCobranzaBody"><tr><td colspan="9"><div class="empty-state"><i class="fas fa-hand-holding-dollar"></i><p>Cargando...</p></div></td></tr></tbody></table></div></div>
</div>
<div class="modal fade" id="cobranzaAbonoModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content border-0 shadow"><div class="modal-header border-0"><h5 class="modal-title fw-bold">Registrar cobranza</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="small mb-2" id="cobranzaAbonoInfo"></div><label class="form-label">Monto <span class="text-danger">*</span></label><input type="number" class="form-control mb-2" id="cobranzaAbonoMonto" min="0.01" step="0.01"><label class="form-label">Caja abierta <span class="text-danger">*</span></label><select class="form-select mb-2" id="cobranzaAbonoCaja"></select><label class="form-label">Forma de pago <span class="text-danger">*</span></label><select class="form-select" id="cobranzaAbonoTipoPago"></select></div><div class="modal-footer border-0"><button class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-success btn-sm" id="btnGuardarCobranzaAbono">Registrar abono</button></div></div></div></div>
